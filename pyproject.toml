[project]
name = "marray-capture"
version = "0.1.0"
description = "开放式耳机麦克风阵列 —— 干扰人扫频实录采集 / IR 可靠性验证 / RIR 混响随机增强 一体化工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "PyYAML>=6.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
# 开源离线 TTS。piper 是纯 ONNX 推理, 模型另行下载 (界面里有按钮)。
piper = ["piper-tts>=1.2.0"]
# 微软 Edge 的在线 TTS。客户端开源, 音质最好, 但预渲染时要联网。
edge = ["edge-tts>=6.1.9"]
tts = ["piper-tts>=1.2.0", "edge-tts>=6.1.9"]

[project.scripts]
marray-capture = "marray_capture.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marray_capture"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = true
